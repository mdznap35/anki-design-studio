name: Polish keyboard behavior in English Science tour
on:
  push:
    branches:
      - preview/ensci-first-impression-v1
permissions:
  contents: write
jobs:
  keyboard-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ensci-first-impression-v1
          fetch-depth: 0
      - name: Protect keyboard navigation in search controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ensci.html")
          s=p.read_text(encoding="utf-8")
          old='''    if(event.key==="Escape"){event.preventDefault();end("closed");}
              else if(event.key==="ArrowLeft"&&!event.altKey&&index<steps.length-1){go(index+1);}'''
          new='''    if(event.key==="Escape"){event.preventDefault();end("closed");}
              else if(event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))return;
              else if(event.key==="ArrowLeft"&&!event.altKey&&index<steps.length-1){go(index+1);}'''
          if old not in s: raise SystemExit("keyboard guard anchor not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit only the page and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-ensci-keyboard.yml
          git add ensci.html
          git commit -m "Guard tour keyboard shortcuts while editing filters"
          git push origin HEAD:preview/ensci-first-impression-v1
