name: Build and publish optimized gallery previews

concurrency:
  group: anki-gallery-publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - master
      - gallery-static-previews
    paths:
      - "tools/build_galleries.py"
      - "tools/decks/**"
      - "tools/capture_gallery_previews.mjs"
      - "tools/capture_gallery_layout_screenshots.mjs"
      - ".github/workflows/publish-galleries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image encoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow
          python -m py_compile tools/build_galleries.py

      - name: Protect the original French Bac 12 page
        shell: bash
        run: |
          set -euo pipefail
          expected="e61ffbd3ac43936f79c83f77ba07b26fb1e847aa"
          actual="$(git rev-parse HEAD:public/index.html)"
          test "$actual" = "$expected"
          echo "PASS: public/index.html is the unchanged protected source ($actual)"

      - name: Build the four deck-specific gallery pages
        run: |
          set -euo pipefail
          rm -rf out
          python tools/build_galleries.py
          for deck in fr9 en9 enlit ensci; do
            test -s "out/$deck.html"
          done

      - name: Install Playwright Chromium
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser capture runtime
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture static previews and run mobile browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory out >/tmp/gallery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/fr9.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/capture_gallery_previews.mjs

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path("/tmp/anki-gallery-preview-png")
          output = Path("out/gallery_previews")
          decks = ("fr9", "en9", "enlit", "ensci")
          total = 0
          for deck in decks:
              pngs = sorted((source / deck).glob("*.png"))
              assert len(pngs) == 100, f"{deck}: expected 100 PNG captures, got {len(pngs)}"
              target = output / deck
              target.mkdir(parents=True, exist_ok=True)
              deck_bytes = 0
              for png in pngs:
                  with Image.open(png) as original:
                      image = original.convert("RGB")
                      image = ImageOps.fit(
                          image, (220, 450),
                          method=Image.Resampling.LANCZOS,
                          centering=(0.5, 0.5)
                      )
                      dest = target / (png.stem + ".webp")
                      image.save(dest, "WEBP", quality=73, method=6)
                  size = dest.stat().st_size
                  assert size > 100 and size <= 120_000, f"{dest}: unexpected size {size}"
                  deck_bytes += size
              total += deck_bytes
              print(f"PASS {deck}: 100 WebP previews, {deck_bytes:,} bytes")
          assert total <= 8_000_000, f"preview bundle too large: {total:,} bytes"
          print(f"PASS all 400 optimized previews: {total:,} bytes")
          PY

          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";

          const decks = ["fr9", "en9", "enlit", "ensci"];
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            for (const deck of decks) {
              const page = await browser.newPage({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1
              });
              const errors = [];
              page.on("pageerror", error => errors.push(error.message));
              await page.emulateMedia({ reducedMotion: "reduce" });
              await page.goto("http://127.0.0.1:8765/" + deck + ".html", {
                waitUntil: "domcontentloaded"
              });
              await page.evaluate(() => {
                if (typeof window.closeOnboarding === "function") window.closeOnboarding();
                window.openGalleryBrowser();
              });
              await page.waitForFunction(() =>
                document.querySelectorAll("#gbGrid .gb-item").length === 100,
                null,
                { timeout: 15000 }
              );

              const state = await page.evaluate(async () => {
                const images = [...document.querySelectorAll("#gbGrid img.gb-img")];
                const allLazy = images.length === 100 &&
                  images.every(image => image.getAttribute("loading") === "lazy");
                // The real grid stays lazy-loaded. For the audit only, ask the
                // browser to fetch every asset so we can verify all 100 URLs.
                images.forEach(image => { image.loading = "eager"; });
                const decoded = await Promise.all(images.map(image =>
                  image.decode().then(() => true, () => false)
                ));
                return {
                  cards: document.querySelectorAll("#gbGrid .gb-item").length,
                  images: images.length,
                  iframes: document.querySelectorAll("#gbGrid iframe").length,
                  wrongDeckPaths: images.filter(image =>
                    !image.getAttribute("src").includes("/gallery_previews/")
                  ).length,
                  allLazy,
                  loaded: images.filter(image => image.complete && image.naturalWidth > 0).length,
                  broken: decoded.filter(ok => !ok).length
                };
              });
              console.log(deck, JSON.stringify(state), "pageErrors=", JSON.stringify(errors));
              assert.equal(state.cards, 100, deck + ": wrong gallery card count");
              assert.equal(state.images, 100, deck + ": wrong thumbnail count");
              assert.equal(state.iframes, 0, deck + ": live iframes remain in the grid");
              assert.equal(state.wrongDeckPaths, 0, deck + ": thumbnail path is not deck preview path");
              assert.equal(state.loaded, 100, deck + ": not all thumbnails loaded");
              assert.equal(state.broken, 0, deck + ": broken thumbnails");
              assert.equal(errors.length, 0, deck + ": uncaught browser errors");
              await page.close();
            }
          } finally {
            await browser.close();
          }
          JS

      - name: Verify only the four gallery pages were generated
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          sys.path.insert(0, "tools")
          from build_galleries import bmatch

          for deck in ("fr9", "en9", "enlit", "ensci"):
              html = Path("out", deck + ".html").read_text(encoding="utf-8")
              marker = "var EMBEDDED_DESIGNS_100 = "
              start = html.index("[", html.index(marker) + len(marker))
              designs = json.loads(html[start:bmatch(html, start) + 1])
              thumbs = sorted((Path("out/gallery_previews") / deck).glob("*.webp"))
              assert len(designs) == 100 and all(item.get("pack") == deck for item in designs)
              assert len(thumbs) == 100
              assert "gallery_previews/'+DECK_ID+'" in html
              assert "gb-preview-frame" not in html
              print(f"PASS {deck}: 100 deck-bound designs + 100 static preview images")
          PY

      - name: Verify quick tour and single-preview interactions
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory out >/tmp/gallery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/fr9.html >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";

          const decks = [
            { id: "fr9", language: "الفرنسي", sample: "Leçon" },
            { id: "en9", language: "الإنجليزي", sample: "Student" },
            { id: "enlit", language: "الإنجليزي", sample: "Novel" },
            { id: "ensci", language: "الإنجليزي", sample: "Atom" }
          ];
          const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
          try {
            for (const deck of decks) {
              for (const viewport of [
                { name: "mobile", width: 390, height: 844 },
                { name: "desktop", width: 1440, height: 1000 }
              ]) {
                const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
                const errors = [];
                page.on("pageerror", error => errors.push(error.message));
                await page.emulateMedia({ reducedMotion: "reduce" });
                await page.goto("http://127.0.0.1:8765/" + deck.id + ".html", { waitUntil: "domcontentloaded" });
                await page.evaluate(() => {
                  if (typeof closeOnboarding === "function") closeOnboarding();
                  if (typeof showOnboarding === "function") showOnboarding();
                });
                await page.waitForSelector("#onboardOverlay .tour-title", { state: "visible", timeout: 10000 });
                const initial = await page.evaluate(() => ({
                  open: document.getElementById("onboardOverlay").style.display !== "none",
                  steps: document.querySelectorAll("#onboardBox .tour-route-item").length,
                  language: TOUR_DECK.language,
                  sample: TOUR_DECK.word,
                  visual: !!document.querySelector("#onboardBox .tour-visual"),
                  cornerFlip: !!document.querySelector("#gvStage .gv-fab.gv-flip"),
                  answerControl: !!document.getElementById("gvShowAns"),
                  progress: document.querySelector("#onboardBox [role=progressbar]")?.getAttribute("aria-valuenow"),
                  staleFrenchCopy: /صمت قبل الفرنسي|الصوت الفرنسي|الكلمة الفرنسية|خط فرنسي|الخط الفرنسي/.test(document.body.innerText)
                }));
                assert.equal(initial.open, true, deck.id + ": tour did not open");
                assert.equal(initial.steps, 5, deck.id + ": tour should contain five steps");
                assert.equal(initial.language, deck.language, deck.id + ": wrong primary voice language");
                assert.equal(initial.sample, deck.sample, deck.id + ": wrong deck sample word");
                assert.equal(initial.visual, true, deck.id + ": tour visual missing");
                assert.equal(initial.cornerFlip, false, deck.id + ": corner flip control still present");
                assert.equal(initial.answerControl, true, deck.id + ": main answer/flip control was removed");
                assert.equal(initial.progress, "20", deck.id + ": initial progress is incorrect");
                if (deck.id !== "fr9") {
                  assert.equal(initial.staleFrenchCopy, false, deck.id + ": French-only copy leaked into the English gallery UI");
                } else {
                  assert.equal(initial.staleFrenchCopy, false, deck.id + ": English copy unexpectedly leaked into the French 9 gallery UI");
                }

                await page.locator("[data-tour-next]").click();
                assert.equal(await page.evaluate(() => onbStep), 1, deck.id + ": next step failed");
                await page.locator("[data-tour-prev]").click();
                assert.equal(await page.evaluate(() => onbStep), 0, deck.id + ": previous step failed");
                await page.locator("#onboardBox .tour-route-item").nth(3).click();
                assert.equal(await page.evaluate(() => onbStep), 3, deck.id + ": direct step navigation failed");
                assert.match(await page.locator("#onboardBox .tour-visual").innerText(), /VOICE STUDIO|إعدادات النطق/i);
                await page.locator("#onboardBox .tour-route-item").nth(4).click();
                assert.equal(await page.evaluate(() => onbStep), 4, deck.id + ": export step did not open");
                await page.locator("[data-tour-next]").click();
                await page.waitForFunction(() => document.getElementById("onboardOverlay").style.display === "none");
                await page.evaluate(() => showOnboarding());
                await page.waitForSelector("#onboardOverlay .tour-title", { state: "visible" });
                await page.keyboard.press("Escape");
                await page.waitForFunction(() => document.getElementById("onboardOverlay").style.display === "none");

                const layout = await page.evaluate(() => {
                  const main = document.querySelector("#onboardBox .tour-main");
                  return {
                    viewport: window.innerWidth,
                    document: document.documentElement.scrollWidth,
                    mainClient: main.clientWidth,
                    mainScroll: main.scrollWidth
                  };
                });
                assert.ok(layout.document <= layout.viewport + 1, deck.id + " " + viewport.name + ": horizontal page overflow " + JSON.stringify(layout));
                assert.ok(layout.mainScroll <= layout.mainClient + 2, deck.id + " " + viewport.name + ": tour content overflows horizontally " + JSON.stringify(layout));
                assert.equal(errors.length, 0, deck.id + " " + viewport.name + ": page errors " + JSON.stringify(errors));
                console.log("PASS tour", deck.id, viewport.name, JSON.stringify(initial), JSON.stringify(layout));
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
          JS

      - name: Capture full gallery layout screenshots (mobile + desktop)
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory out >/tmp/gallery-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/fr9.html >/dev/null; then break; fi
            sleep 1
          done
          node tools/capture_gallery_layout_screenshots.mjs

      - name: Upload visual audit screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gallery-visual-audit
          path: /tmp/anki-gallery-layout-shots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Publish only the four gallery pages and their previews to Render (master only)
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          expected="e61ffbd3ac43936f79c83f77ba07b26fb1e847aa"
          test "$(git rev-parse HEAD:public/index.html)" = "$expected"
          cp out/fr9.html out/en9.html out/enlit.html out/ensci.html public/
          mkdir -p public/gallery_previews
          cp -R out/gallery_previews/. public/gallery_previews/
          test "$(git hash-object public/index.html)" = "$expected"
          git diff --exit-code -- public/index.html public/bac12.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fr9.html public/en9.html public/enlit.html public/ensci.html public/gallery_previews/
          if git diff --cached --quiet; then
            echo "No gallery output changes to publish."
          else
            git commit -m "Publish optimized deck-specific gallery previews"
            built_builder_sha="$(git rev-parse HEAD:tools/build_galleries.py)"
            built_decks_sha="$(git rev-parse HEAD:tools/decks)"
            git fetch origin master
            remote_builder_sha="$(git rev-parse origin/master:tools/build_galleries.py)"
            remote_decks_sha="$(git rev-parse origin/master:tools/decks)"
            if [[ "$built_builder_sha" != "$remote_builder_sha" || "$built_decks_sha" != "$remote_decks_sha" ]]; then
              echo "Gallery build inputs changed during this run; refusing to publish stale output. A fresh run will rebuild from the new inputs."
              exit 1
            fi
            git rebase origin/master
            git push origin HEAD:master
          fi
