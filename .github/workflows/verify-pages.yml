name: Verify published GitHub Pages galleries

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-pages.yml"
      - "en9.html"
      - "enlit.html"
      - "ensci.html"
      - "fr9.html"
      - "gallery_imgs/**"
      - "ensci-history-01-latest.html"
      - "ensci-history-02-2026-11-07-1605.html"
      - "ensci-history-03-2026-11-07-1602.html"
      - "ensci-history-04-2026-11-07-1540.html"
      - "ensci-history-05-2026-11-07-0855.html"
      - "ensci-history-06-2026-11-07-0736.html"
      - "ensci-history-07-2026-11-07-0635.html"
      - "ensci-history-08-2026-11-07-0537.html"
      - "ensci-history-09-2026-11-06-1938.html"
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify all four live galleries and shared thumbnails
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "https://mdznap35.github.io/anki-design-studio"
          decks = ("en9", "enlit", "ensci", "fr9")

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "anki-design-studio-pages-verifier/1.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.headers, response.read()

          failures = []
          for deck in decks:
              url = f"{base}/{deck}.html"
              try:
                  status, headers, raw = fetch(url)
                  html = raw.decode("utf-8")
                  marker = "var EMBEDDED_DESIGNS_100 = "
                  pos = html.index(marker) + len(marker)
                  payload = html[pos:].lstrip()
                  designs, _ = json.JSONDecoder().raw_decode(payload)
                  assert status == 200, f"HTTP {status}"
                  assert len(designs) == 100, f"expected 100 designs, got {len(designs)}"
                  assert all(item.get("pack") == deck for item in designs), "wrong deck binding"
                  assert all(item.get("fields") for item in designs), "missing field mappings"
                  assert "gallery_imgs/" in html, "shared thumbnail path missing"
                  assert f"gallery_imgs_{deck}/" not in html, "stale thumbnail path found"
                  print(f"PASS {deck}: HTTP 200, 100 designs, correct deck binding")
              except Exception as exc:
                  failures.append(f"{deck}: {exc}")

          for sample in ("001.jpg", "050.jpg", "100.jpg"):
              try:
                  status, headers, body = fetch(f"{base}/gallery_imgs/{sample}")
                  assert status == 200, f"HTTP {status}"
                  assert headers.get_content_type() == "image/jpeg", "wrong content type"
                  assert len(body) > 1000, f"unexpectedly small image ({len(body)} bytes)"
                  print(f"PASS thumbnail {sample}: HTTP 200 image/jpeg ({len(body)} bytes)")
              except Exception as exc:
                  failures.append(f"thumbnail {sample}: {exc}")

          previews = (
              "ensci-history-01-latest.html",
              "ensci-history-02-2026-11-07-1605.html",
              "ensci-history-03-2026-11-07-1602.html",
              "ensci-history-04-2026-11-07-1540.html",
              "ensci-history-05-2026-11-07-0855.html",
              "ensci-history-06-2026-11-07-0736.html",
              "ensci-history-07-2026-11-07-0635.html",
              "ensci-history-08-2026-11-07-0537.html",
              "ensci-history-09-2026-11-06-1938.html",
          )
          for filename in previews:
              try:
                  status, headers, raw = fetch(f"{base}/{filename}")
                  html = raw.decode("utf-8")
                  marker = "var EMBEDDED_DESIGNS_100 = "
                  pos = html.index(marker) + len(marker)
                  designs, _ = json.JSONDecoder().raw_decode(html[pos:].lstrip())
                  assert status == 200, f"HTTP {status}"
                  assert len(designs) == 100, f"expected 100 designs, got {len(designs)}"
                  assert all(item.get("pack") == "ensci" for item in designs), "wrong deck binding"
                  assert "gallery_imgs/" in html, "shared thumbnail path missing"
                  print(f"PASS preview {filename}: HTTP 200, 100 English Bac Science designs")
              except Exception as exc:
                  failures.append(f"preview {filename}: {exc}")

          if failures:
              raise SystemExit("GitHub Pages live verification failed:\\n" + "\\n".join(failures))
          print("ALL LIVE GITHUB PAGES CHECKS PASSED")
          PY
