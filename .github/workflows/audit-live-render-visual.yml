name: Audit live Render gallery visuals

on:
  push:
    branches:
      - audit/render-live-browser-2026-11-05

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Open the actual production Render routes in Chromium
        env:
          AUDIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p live-render-audit
          node <<'JS'
          const { chromium } = require("playwright");
          const fs = require("node:fs/promises");
          const assert = require("node:assert/strict");

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ["--no-sandbox"] });
            const origin = "https://anki-design-studio.onrender.com";
            const decks = [
              { id: "fr9", word: "Leçon" },
              { id: "en9", word: "Student" },
              { id: "enlit", word: "Novel" },
              { id: "ensci", word: "Atom" }
            ];
            const results = [];
            const failures = [];
            try {
              for (const deck of decks) {
                for (const viewport of [
                  { name: "mobile", width: 390, height: 844 },
                  { name: "desktop", width: 1440, height: 1000 }
                ]) {
                  const page = await browser.newPage({
                    viewport: { width: viewport.width, height: viewport.height },
                    deviceScaleFactor: 1
                  });
                  const pageErrors = [];
                  const httpErrors = [];
                  page.on("pageerror", error => pageErrors.push(error.message));
                  page.on("response", response => {
                    const url = response.url();
                    if (url.startsWith(origin) && response.status() >= 400) {
                      httpErrors.push({ status: response.status(), url });
                    }
                  });
                  await page.emulateMedia({ reducedMotion: "reduce" });
                  const url = origin + "/" + deck.id + "?live_visual_audit=" + process.env.AUDIT_SHA + "-" + viewport.name;
                  let response = null;
                  let lastNavigationError = "";
                  for (let attempt = 1; attempt <= 12; attempt++) {
                    try {
                      response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 90000 });
                      const status = response ? response.status() : null;
                      console.log("NAVIGATION", deck.id, viewport.name, "attempt", attempt, "status", status, "finalUrl", page.url());
                      if (response && status === 200) break;
                    } catch (error) {
                      lastNavigationError = error.message;
                      console.log("NAVIGATION RETRY", deck.id, viewport.name, "attempt", attempt, lastNavigationError);
                    }
                    await page.waitForTimeout(10000);
                  }
                  if (!response || response.status() !== 200) {
                    const diagnostic = await page.evaluate(() => ({
                      title: document.title,
                      url: location.href,
                      body: document.body ? document.body.innerText.slice(0, 1000) : ""
                    })).catch(error => ({ pageDiagnosticError: String(error) }));
                    throw new Error(deck.id + " " + viewport.name + ": route did not return HTTP 200; lastError=" + lastNavigationError + "; page=" + JSON.stringify(diagnostic));
                  }
                  // Wait for the parser and every blocking inline script to finish.
                  await page.waitForLoadState("load", { timeout: 90000 }).catch(error =>
                    console.log("LOAD STATE WARNING", deck.id, viewport.name, error.message)
                  );
                  await page.waitForFunction(() => document.readyState === "complete", null, { timeout: 45000 }).catch(error =>
                    console.log("DOCUMENT READY WARNING", deck.id, viewport.name, error.message)
                  );
                  const beforeOpen = await page.evaluate(() => {
                    let gvType = "missing";
                    let gvLength = null;
                    try {
                      gvType = typeof gvList;
                      if (Array.isArray(gvList)) gvLength = gvList.length;
                    } catch (error) {
                      gvType = "ReferenceError: " + error.message;
                    }
                    return {
                      readyState: document.readyState,
                      openGalleryBrowser: typeof window.openGalleryBrowser,
                      gvListType: gvType,
                      gvListLength: gvLength,
                      gvCompute: typeof window.gvCompute,
                      initApp: typeof window.initApp,
                      designs: typeof window.EMBEDDED_DESIGNS_100,
                      pageTitle: document.title,
                      scriptCount: document.scripts.length
                    };
                  });
                  console.log("LIVE PAGE INITIALIZATION", deck.id, viewport.name, JSON.stringify(beforeOpen));
                  const baseScreenshot = "live-render-audit/" + deck.id + "-" + viewport.name + "-page.png";
                  await page.screenshot({ path: baseScreenshot, fullPage: false, animations: "disabled" });
                  const galleryOpenError = await page.evaluate(() => {
                    try {
                      if (typeof window.closeOnboarding === "function") window.closeOnboarding();
                      if (typeof window.openGalleryBrowser !== "function") return "openGalleryBrowser is missing";
                      window.openGalleryBrowser();
                      return "";
                    } catch (error) {
                      return error.name + ": " + error.message + "\\n" + (error.stack || "");
                    }
                  });
                  if (galleryOpenError) {
                    console.log("GALLERY OPEN ERROR", deck.id, viewport.name, galleryOpenError);
                  }
                  await page.waitForFunction(() => {
                    const grid = document.querySelector("#gbGrid");
                    return document.readyState === "complete"
                      && Array.isArray(window.gvList) && window.gvList.length === 100
                      && grid && grid.querySelectorAll(".gb-item").length === 100
                      && grid.querySelectorAll("img.gb-img").length === 100;
                  }, null, { timeout: 45000 }).catch(error =>
                    console.log("GRID READY WARNING", deck.id, viewport.name, error.message)
                  );

                  // Trigger every lazy thumbnail so the audit can distinguish
                  // missing/wrong assets from images that have not entered view yet.
                  const imageSummary = await page.evaluate(async () => {
                    const grid = document.querySelector("#gbGrid");
                    const imgs = Array.from(grid ? grid.querySelectorAll("img.gb-img") : []);
                    imgs.forEach(img => { img.loading = "eager"; });
                    await Promise.all(imgs.map(img => img.decode().catch(() => null)));
                    return {
                      count: imgs.length,
                      loaded: imgs.filter(img => img.complete && img.naturalWidth > 0).length,
                      broken: imgs.filter(img => img.complete && img.naturalWidth === 0).length,
                      sources: imgs.map(img => img.getAttribute("src")),
                    };
                  });
                  await page.waitForTimeout(500);

                  const metrics = await page.evaluate((expectedWord) => {
                    const pick = (selector) => document.querySelector(selector);
                    const css = (selector) => {
                      const el = pick(selector);
                      if (!el) return null;
                      const s = getComputedStyle(el);
                      const r = el.getBoundingClientRect();
                      return {
                        display: s.display,
                        visibility: s.visibility,
                        backgroundColor: s.backgroundColor,
                        backgroundImage: s.backgroundImage,
                        color: s.color,
                        borderRadius: s.borderRadius,
                        objectFit: s.objectFit,
                        width: Math.round(r.width),
                        height: Math.round(r.height)
                      };
                    };
                    const gallery = pick("#galleryBrowser");
                    const grid = pick("#gbGrid");
                    const first = grid && grid.querySelector(".gb-item");
                    const firstImage = first && first.querySelector("img.gb-img");
                    const previewFrame = pick("#gvFrame");
                    let previewInfo = null;
                    if (previewFrame) {
                      try {
                        const doc = previewFrame.contentDocument;
                        const scene = doc && (doc.querySelector(".scene") || doc.body);
                        const sceneStyle = scene && getComputedStyle(scene);
                        previewInfo = {
                          readyState: doc && doc.readyState,
                          title: doc && doc.title,
                          text: (doc && doc.body ? doc.body.innerText : "").slice(0, 220),
                          sceneBackground: sceneStyle && sceneStyle.backgroundColor,
                          sceneBackgroundImage: sceneStyle && sceneStyle.backgroundImage,
                          sceneColor: sceneStyle && sceneStyle.color,
                          sceneWidth: scene && Math.round(scene.getBoundingClientRect().width)
                        };
                      } catch (error) {
                        previewInfo = { accessError: String(error) };
                      }
                    }
                    const imgSources = Array.from(grid ? grid.querySelectorAll("img.gb-img") : []).map(img => img.getAttribute("src") || "");
                    const deckPrefix = "/gallery_previews/" + location.pathname.replace(/^\\//, "") + "/";
                    const deckSpecific = imgSources.filter(src => src.includes(deckPrefix)).length;
                    const shared = imgSources.filter(src => src.includes("gallery_imgs/")).length;
                    return {
                      title: document.title,
                      styleSheets: document.styleSheets.length,
                      galleryOpen: !!gallery && gallery.classList.contains("open"),
                      gallery: css("#galleryBrowser"),
                      grid: css("#gbGrid"),
                      firstCard: css("#gbGrid .gb-item"),
                      firstImage: css("#gbGrid img.gb-img"),
                      imageCount: imgSources.length,
                      deckSpecificPreviewCount: deckSpecific,
                      sharedThumbnailCount: shared,
                      uniqueImageSources: new Set(imgSources).size,
                      visibleSampleWordInGrid: (grid && grid.innerText || "").includes(expectedWord),
                      previewFrame: css("#gvFrame"),
                      previewInfo,
                      body: css("body")
                    };
                  }, deck.word);

                  const screenshot = "live-render-audit/" + deck.id + "-" + viewport.name + "-grid.png";
                  await page.screenshot({ path: screenshot, fullPage: false, animations: "disabled" });

                  // Capture the first-visit tour on the real production page too.
                  await page.evaluate(() => {
                    if (typeof window.closeOnboarding === "function") window.closeOnboarding();
                    if (typeof window.showOnboarding === "function") window.showOnboarding();
                  });
                  await page.waitForTimeout(350);
                  const tour = await page.evaluate(() => {
                    const overlay = document.querySelector("#onboardOverlay");
                    const title = overlay && overlay.querySelector(".tour-title, .ob-title, h1, h2");
                    const s = overlay ? getComputedStyle(overlay) : null;
                    return {
                      exists: !!overlay,
                      open: !!overlay && (overlay.open || overlay.hasAttribute("open")),
                      display: s && s.display,
                      visibility: s && s.visibility,
                      title: title && title.textContent,
                      box: overlay && (() => { const r=overlay.getBoundingClientRect(); return {width:Math.round(r.width),height:Math.round(r.height)}; })()
                    };
                  });
                  const tourScreenshot = "live-render-audit/" + deck.id + "-" + viewport.name + "-tour.png";
                  await page.screenshot({ path: tourScreenshot, fullPage: false, animations: "disabled" });

                  const entry = { deck: deck.id, expectedWord: deck.word, viewport: viewport.name, url, httpStatus: response.status(), metrics, imageSummary, tour, pageErrors, httpErrors, screenshot, tourScreenshot };
                  results.push(entry);
                  console.log(JSON.stringify(entry));
                  if (!metrics.galleryOpen || metrics.gallery.display !== "flex" || metrics.grid.display !== "grid"
                      || metrics.imageCount !== 100 || imageSummary.loaded < 20 || imageSummary.broken > 0
                      || metrics.firstCard.borderRadius === "0px" || pageErrors.length || httpErrors.length) {
                    failures.push(deck.id + "/" + viewport.name + ": " + JSON.stringify(entry));
                  }
                  if (metrics.deckSpecificPreviewCount !== 100) {
                    console.log("DECK PREVIEW SOURCE REGRESSION", deck.id, "deckSpecific=", metrics.deckSpecificPreviewCount,
                      "shared=", metrics.sharedThumbnailCount, "sample=", metrics.imageSummary && metrics.imageSummary.sources && metrics.imageSummary.sources.slice(0, 4));
                  }
                  await page.close();
                }
              }
              await fs.writeFile("live-render-audit/results.json", JSON.stringify(results, null, 2));
              await fs.writeFile("live-render-audit/failures.json", JSON.stringify(failures, null, 2));
              if (failures.length) throw new Error("Live Render browser visual audit failed:\n" + failures.join("\n"));
              console.log("LIVE RENDER VISUAL AUDIT PASS: all four clean routes rendered 100 styled template previews on mobile and desktop.");
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-render-browser-audit
          path: live-render-audit/
          if-no-files-found: warn
          retention-days: 30
