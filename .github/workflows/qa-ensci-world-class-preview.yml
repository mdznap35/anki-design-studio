name: QA isolated world-class preview

on:
  push:
    branches:
      - "work/ensci-world-class-v1-2026-11-12"
    paths:
      - "ensci-world-class-preview.html"
      - ".github/workflows/qa-ensci-world-class-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve preview files
        run: |
          python -m http.server 8765 >/tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ensci-world-class-preview.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/server.log
          exit 1
      - name: Test wrapper, iframe, search, template count, and mobile layout
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/test_preview.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          errors=[]
          out={}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":1000})
              page.on("pageerror",lambda e:errors.append(str(e)))
              response=page.goto("http://127.0.0.1:8765/ensci-world-class-preview.html",wait_until="domcontentloaded",timeout=60000)
              assert response and response.status==200
              frame=page.frame_locator("#site")
              frame.locator("#gxWelcome").wait_for(state="visible",timeout=30000)
              out["wrapper_title"]=page.title()
              out["iframe_url"]=page.locator("#site").get_attribute("src")
              page.screenshot(path="qa-artifacts/01-wrapper-first-visit.png",full_page=True)
              frame.locator("#gxWelcomeExplore").click()
              frame.locator("#gbGrid .gb-item").first.wait_for(timeout=30000)
              page.wait_for_timeout(1500)
              cards=frame.locator("#gbGrid .gb-item").count()
              assert cards==100,f"Expected 100 cards, got {cards}"
              frame.locator("#wcSearchInput").wait_for(timeout=15000)
              search=frame.locator("#wcSearchInput")
              search.fill("Energy")
              page.wait_for_timeout(400)
              visible=frame.locator("#gbGrid .gb-item:visible").count()
              assert visible>0 and visible<100,f"Search did not filter results: {visible}"
              out["search_energy_visible"]=visible
              out["search_status"]=frame.locator("#wcSearchStatus").inner_text()
              search.fill("")
              page.wait_for_timeout(300)
              assert frame.locator("#gbGrid .gb-item:visible").count()==100
              frame.locator("#gbGrid .gb-item").first.click()
              frame.locator("#gvStage").wait_for(state="visible",timeout=15000)
              out["individual_preview"]=True
              out["select_button_count"]=frame.locator("#gvSelectBtn").count()
              page.screenshot(path="qa-artifacts/02-library-desktop.png",full_page=True)
              page.set_viewport_size({"width":390,"height":844})
              page.wait_for_timeout(500)
              metrics=frame.locator("body").evaluate("(e)=>({viewport:document.documentElement.clientWidth,scroll:document.documentElement.scrollWidth})")
              out["mobile"]=metrics
              assert metrics["scroll"]<=metrics["viewport"]+2,f"Mobile overflow: {metrics}"
              out["cards"]=cards
              out["page_errors"]=errors
              assert not errors,errors
              Path("qa-artifacts/results.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
              print(json.dumps(out,ensure_ascii=False,indent=2))
              browser.close()
          PY
          python /tmp/test_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: ensci-world-class-preview-qa
          path: qa-artifacts/
          retention-days: 30
