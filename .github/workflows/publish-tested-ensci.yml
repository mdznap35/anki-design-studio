name: Publish tested English Science gallery only

on:
  push:
    branches:
      - "release/ensci-dark-welcome-2026-11-08"
    paths:
      - ".github/workflows/publish-tested-ensci.yml"

permissions:
  contents: write

jobs:
  copy-tested-ensci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the clean main-based release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the exact browser-tested ENSCI page
        run: |
          set -euo pipefail
          git fetch origin "redesign/ensci-welcome-dark-v1-2026-11-08"
          git show "FETCH_HEAD:ensci.html" > /tmp/tested-ensci.html
          git show "605f9107813fe60d89d024c9fc895b6d7ab55b6a:ensci.html" > /tmp/ensci-v6.html

      - name: Verify all 100 templates are identical to v6 before copying
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          def get_designs(path):
              html = Path(path).read_text(encoding="utf-8")
              marker = "var EMBEDDED_DESIGNS_100 = "
              pos = html.index(marker) + len(marker)
              start = html.index("[", pos)
              data, _ = json.JSONDecoder().raw_decode(html[start:])
              return html, data

          base, base_data = get_designs("/tmp/ensci-v6.html")
          candidate, candidate_data = get_designs("/tmp/tested-ensci.html")
          assert len(base_data) == len(candidate_data) == 100
          assert base_data == candidate_data, "Candidate template payload differs from v6"
          assert len({x.get("name") for x in candidate_data}) == 100
          assert all(x.get("pack") == "ensci" for x in candidate_data)
          assert all(x.get("fields") and x.get("front") and x.get("back") and x.get("css") for x in candidate_data)
          assert all("English" in x["fields"] and "Arabic" in x["fields"] for x in candidate_data)

          base_ids = set(re.findall(r'\bid="([^"]+)"', base))
          candidate_ids = set(re.findall(r'\bid="([^"]+)"', candidate))
          assert not (base_ids - candidate_ids), "Candidate removed original DOM IDs"
          for token in (
              'id="gxWelcome"',
              'id="gbFilters"',
              'id="gbGrid"',
              'id="gvStage"',
              'id="gvSelectBtn"',
              'id="ensci-welcome-polish"',
              'id="ensci-preview-guide-runtime"',
              "var(--bg,#0b1020)",
          ):
              assert token in candidate, "Required tested feature missing: " + token

          print("PASS: 100 template payloads are identical to selected v6")
          print("PASS: all original DOM IDs remain")
          print("PASS: tested welcome, gallery, preview, and dark-first theme are present")
          PY

      - name: Replace only ensci.html and remove this temporary workflow
        run: |
          set -euo pipefail
          cp /tmp/tested-ensci.html ensci.html
          git add -- ensci.html
          git rm -- .github/workflows/publish-tested-ensci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish tested dark-first English Science gallery"
          git push origin "HEAD:refs/heads/release/ensci-dark-welcome-2026-11-08"
