name: Apply isolated English Science opening redesign
on:
  push:
    branches:
      - preview/ensci-first-impression-v1
permissions:
  contents: write
jobs:
  patch-approved-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/ensci-first-impression-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply the reviewed patch to the exact Version 6 file
        run: |
          python3 - <<'PY'
          import base64, gzip
          payload = ""
          exec(compile(gzip.decompress(base64.b64decode(payload)), "patch-ensci-v6.py", "exec"))
          PY
      - name: Commit only ensci.html and remove the temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-ensci-patch.yml
          git add ensci.html
          git commit -m "Redesign English Bac Science opening and interactive tour"
          git push origin HEAD:preview/ensci-first-impression-v1
