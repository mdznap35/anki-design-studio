name: Build local gallery review package

on:
  push:
    branches:
      - gallery-local-preview-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the four original galleries
        run: |
          set -euo pipefail
          python -m py_compile tools/build_galleries.py
          python tools/build_galleries.py
      - name: Escape a literal closing-script token inside the preview sanitizer
        run: |
          python - <<'PY'
          from pathlib import Path
          for deck in ("fr9", "en9", "enlit", "ensci"):
              p = Path("out", deck + ".html")
              html = p.read_text(encoding="utf-8")
              count = html.count("</script>/gi")
              print(deck, "unsafe sanitizer terminators found:", count)
              if count:
                  html = html.replace("</script>/gi", "<\\/script>/gi")
                  p.write_text(html, encoding="utf-8")
          PY
      - name: Verify gallery data and required image assets
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from build_galleries import bmatch
          root = Path("out")
          images = sorted((root / "gallery_imgs").glob("*.jpg"))
          assert len(images) == 100, f"expected 100 images, got {len(images)}"
          for deck in ("fr9", "en9", "enlit", "ensci"):
              p = root / f"{deck}.html"
              h = p.read_text(encoding="utf-8")
              marker = "var EMBEDDED_DESIGNS_100 = "
              pos = h.index(marker) + len(marker)
              start = h.index("[", pos)
              designs = json.loads(h[start:bmatch(h, start) + 1])
              assert len(designs) == 100, (deck, len(designs))
              assert all(x.get("pack") == deck for x in designs)
              assert "gallery_imgs/" in h
              assert "gallery_imgs_" + deck + "/" not in h
              assert not re.search(r'<button\b[^>]*\bextra-btn\b[^>]*>', h, re.I), f"{deck}: extra buttons remain"
              print(f"PASS {deck}: 100 designs; image references; extra buttons removed; {p.stat().st_size:,} bytes")
          print("PASS 100 thumbnails")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runtime
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Diagnose inline JavaScript syntax
        continue-on-error: true
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.items=[]
                  self.current=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script":
                      self.current=[]
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current is not None:
                      self.items.append("".join(self.current))
                      self.current=None
          for deck in ("fr9", "en9", "enlit", "ensci"):
              parser=Scripts()
              parser.feed(Path("out",deck+".html").read_text(encoding="utf-8"))
              for i,source in enumerate(parser.items):
                  Path(f"/tmp/{deck}-{i}.js").write_text(source,encoding="utf-8")
              print(deck,"actual inline script elements",len(parser.items))
          PY
          for f in /tmp/{fr9,en9,enlit,ensci}-*.js; do
            echo "CHECK $f"
            node --check "$f" || true
          done
      - name: Browser smoke test before packaging
        run: |
          set -euo pipefail
          mkdir -p review-package/screenshots
          python -m http.server 8765 --directory out >/tmp/gallery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/fr9.html >/dev/null; then break; fi
            sleep 1
          done
          node <<'JS'
          const { chromium } = require("playwright");
          const assert = require("node:assert/strict");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const deck of ["fr9", "en9", "enlit", "ensci"]) {
                const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
                const errors = [];
                page.on("pageerror", e => errors.push(e.stack || e.message));
                await page.goto("http://127.0.0.1:8765/" + deck + ".html", { waitUntil: "domcontentloaded" });
                await page.waitForTimeout(5000);
                const state = await page.evaluate(() => {
                  const text = document.body.innerText || "";
                  const imgs = [...document.images];
                  const loaded = imgs.filter(i => i.complete && i.naturalWidth > 0).length;
                  const loading = text.split("\n").filter(x => /جار[يٍ]?\s*(تنزيل|تحميل)|جاري\s*(تنزيل|تحميل)|تحميل القوالب|تنزيل القوالب/.test(x));
                  return { title: document.title, textLength: text.length, imageCount: imgs.length, loadedImages: loaded, loading };
                });
                console.log(deck, JSON.stringify(state), "pageErrors=", JSON.stringify(errors));
                assert(state.textLength > 100, deck + ": nearly empty page");
                assert.equal(state.loading.length, 0, deck + ": stuck loading message is visible");
                assert.equal(errors.length, 0, deck + ": uncaught browser errors");
                await page.screenshot({ path: "review-package/screenshots/" + deck + ".png", fullPage: true });
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - name: Create a local-use bundle with four HTML files and all thumbnails
        run: |
          set -euo pipefail
          mkdir -p review-package
          cp out/fr9.html out/en9.html out/enlit.html out/ensci.html review-package/
          cp -R out/gallery_imgs review-package/gallery_imgs
          cat > review-package/README-AR.txt <<'EOF'
          حزمة معاينة محلية لمعارض Anki الأربعة

          1) فك ضغط الملف كاملاً.
          2) لا تنقل ملفات HTML وحدها؛ اترك مجلد gallery_imgs بجانبها.
          3) افتح fr9.html أو en9.html أو enlit.html أو ensci.html باستخدام Chrome.
          4) يجب أن تكون شبكة الإنترنت متاحة لتحميل الخطوط الخارجية إن وجدت.
          5) هذه نسخة معاينة فقط؛ لم يتم نشرها على Render أو GitHub Pages.
          EOF
          cd review-package
          zip -qr ../anki-galleries-local-review.zip .
          cd ..
          sha256sum anki-galleries-local-review.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anki-galleries-local-review
          path: |
            anki-galleries-local-review.zip
            review-package/fr9.html
            review-package/en9.html
            review-package/enlit.html
            review-package/ensci.html
            review-package/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
