services:
  - type: web
    name: anki-design-studio
    runtime: python
    plan: free
    buildCommand: apt-get update -y && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 900
    autoDeploy: true
    healthCheckPath: /api/health
envVars:
  - key: PYTHON_VERSION
    value: "3.12"
