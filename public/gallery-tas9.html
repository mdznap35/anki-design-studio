<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رزمة فرنسي تاسع — المعرض الثاني | Anki Design Studio</title>
<style>
:root{--bg:#0b0a14;--s1:rgba(255,255,255,.055);--s2:rgba(255,255,255,.08);--bd:rgba(255,255,255,.12);
--tx:#f1f0f7;--tx2:#b9b5cf;--tx3:#8b87a5;--ac:#7c3aed;--ac2:#a78bfa;--ok:#34d399;--r:16px;
--shadow:0 18px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);
min-height:100vh;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;
background:
radial-gradient(900px 520px at 85% -10%,rgba(124,58,237,.34),transparent 60%),
radial-gradient(800px 500px at -10% 30%,rgba(16,185,129,.18),transparent 60%),
radial-gradient(700px 600px at 60% 110%,rgba(236,72,153,.16),transparent 60%),
#0b0a14}
.wrap{max-width:1280px;margin:0 auto;padding:18px 18px 40px}
/* HEADER */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
background:rgba(13,11,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid var(--bd);border-radius:18px;padding:12px 16px;margin-bottom:20px;
box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.02rem}
.brand .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;
background:linear-gradient(135deg,#7c3aed,#a78bfa);box-shadow:0 6px 18px rgba(124,58,237,.45)}
.brand small{display:block;font-weight:500;color:var(--tx3);font-size:.68rem}
.stats{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:.72rem;color:var(--tx2);background:var(--s1);border:1px solid var(--bd);
padding:6px 11px;border-radius:99px;white-space:nowrap}
.pill b{color:var(--ac2)}
a.back{font-size:.78rem;color:var(--ac2);text-decoration:none;border:1px solid var(--bd);
background:var(--s1);padding:7px 12px;border-radius:99px;transition:.2s}
a.back:hover{border-color:var(--ac);background:rgba(124,58,237,.14)}
/* LAYOUT */
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}}
/* PREVIEW PANEL */
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px)}
.panel h2{font-size:.82rem;color:var(--tx2);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stage{display:flex;justify-content:center;background:rgba(0,0,0,.28);border-radius:14px;
padding:14px;border:1px solid rgba(255,255,255,.06)}
.stage iframe{width:min(380px,88vw);height:min(560px,66vh);border:none;border-radius:12px;
background:#14121f;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.controls{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-family:inherit;
font-size:.8rem;font-weight:700;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ac);background:rgba(124,58,237,.16)}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.idx{font-size:.74rem;color:var(--tx3);margin-inline-start:auto}
/* BROWSER */
.bsearch{position:relative;margin-bottom:10px}
.bsearch input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--bd);color:var(--tx);
border-radius:12px;padding:11px 36px 11px 12px;font-family:inherit;font-size:.82rem;outline:none}
.bsearch input:focus{border-color:var(--ac)}
.bsearch .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.blist{max-height:calc(100vh - 250px);overflow-y:auto;border:1px solid var(--bd);border-radius:12px;background:rgba(0,0,0,.18)}
.blist::-webkit-scrollbar{width:8px}
.blist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;transition:.15s;font-size:.8rem}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:rgba(124,58,237,.12)}
.wrow.on{background:rgba(124,58,237,.2);box-shadow:inset 3px 0 0 var(--ac)}
.wrow .fr{font-weight:700;color:var(--tx)}
.wrow .ar{color:var(--ac2)}
.wrow .do{margin-inline-start:auto;font-size:.66rem;color:var(--tx3);background:var(--s1);
border:1px solid var(--bd);padding:3px 8px;border-radius:99px;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--tx3);font-size:.85rem}
.words-count{font-size:.7rem;color:var(--tx3);margin-bottom:8px}
/* TOAST */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);z-index:99;
background:rgba(20,18,32,.92);border:1px solid var(--bd);backdrop-filter:blur(12px);
color:var(--tx);padding:11px 18px;border-radius:13px;font-size:.8rem;opacity:0;transition:.3s;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="aurora"></div>
<div class="wrap">
<header>
  <a class="back" href="index.html">← المعرض الرئيسي (100 تصميم)</a>
  <div class="brand"><div class="logo">🎴</div><div>رزمة فرنسي تاسع<small>المعرض الثاني — التصميم الحقيقي للرزمة</small></div></div>
  <div class="stats">
    <span class="pill">🗂 <b id="stWords">—</b> كلمة</span>
    <span class="pill">📚 <b id="stDoss">—</b> دوسييه</span>
    <span class="pill">🔊 صوت حقيقي مدمج</span>
  </div>
</header>
<main>
  <section class="panel">
    <h2>🃏 معاينة البطاقة الحقيقية <span style="color:var(--tx3);font-weight:400">— من الرزمة نفسها</span></h2>
    <div class="stage"><iframe id="cardFrame" title="معاينة بطاقة فرنسي تاسع"></iframe></div>
    <div class="controls">
      <button class="btn primary" id="flipBtn">🔄 اقلب البطاقة</button>
      <button class="btn" id="prevBtn">‹ السابقة</button>
      <button class="btn" id="nextBtn">التالية ›</button>
      <span class="idx" id="wordIdx">—</span>
    </div>
  </section>
  <section class="panel">
    <h2>🔍 متصفح الكلمات <span style="color:var(--tx3);font-weight:400">— 1475 كلمة حقيقية</span></h2>
    <div class="bsearch"><span class="ic">🔍</span><input id="searchInput" placeholder="ابحث: فرنسي، عربي، أو دوسييه..." autocomplete="off"></div>
    <div class="words-count" id="wCount"></div>
    <div class="blist" id="wordList"></div>
  </section>
</main>
</div>
<div id="toast"></div>

U1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NkxHwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV"}, "sampleIdx": 1};
var WORDS = DATA.words;
var SAMPLE = DATA.sample;
var SAMPLE_IDX = DATA.sampleIdx;
var cur = SAMPLE_IDX, flipped = false;

/* ---------- speak (TTS رجالي) ---------- */
function pickMale(lang){
  if(!window.speechSynthesis) return null;
  var vs = speechSynthesis.getVoices();
  var pre = lang==='fr'?'fr':'ar';
  var cands = vs.filter(function(v){return (v.lang||'').toLowerCase().indexOf(pre)===0;});
  cands.sort(function(a,b){return (isMaleName(b)?1:0)-(isMaleName(a)?1:0);});
  return cands[0]||null;
}
function isMaleName(v){
  var n=(v.name||'').toLowerCase();
  if(/male|paul|thomas|pierre|henri|youssef|karim|tarek|hassan|maged|hazem|amr|khaled|fares|ali|omar/i.test(n)) return true;
  if(/female|zira|samantha|susan|karen|moira|tessa|fiona|amina|fatima|nadia/i.test(n)) return false;
  return /(fr|ar)-(fr|sa)/.test(v.lang||'') && /google|microsoft|natural|premium/i.test(n) ? true : false;
}
function speakWord(text,lang){
  if(!window.speechSynthesis||!text) return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=lang==='fr'?'fr-FR':'ar-SA';
  u.rate=1; u.pitch=1;
  var v=pickMale(lang); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
window.SAMP_F=WORDS[cur][0]; window.SAMP_A=WORDS[cur][1];
window.__speakWord=function(t,l){speakWord(t,l);};

/* ---------- card render ---------- */
function fillTpl(tpl,w,isSample){
  var frA=isSample?SAMPLE.frAudio:'';
  var arA=isSample?SAMPLE.arAudio:'';
  var boA=isSample?SAMPLE.bothAudio:'';
  return tpl
    .split('{{Français}}').join(w[0])
    .split('{{French}}').join(w[0])
    .split('{{Arabic}}').join(w[1])
    .split('{{Dossier}}').join(w[2])
    .split('{{AudioFR}}').join(frA)
    .split('{{AudioAR}}').join(arA)
    .split('{{AudioBOTH}}').join(boA);
}
function buildDoc(){
  var w=WORDS[cur];
  var tpl=flipped?DATA.afmt:DATA.qfmt;
  var body=fillTpl(tpl,w,cur===SAMPLE_IDX);
  var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+DATA.css+'</style></head><body>'+body
    +'<script>try{var _d0=audioData();if(_d0&&!_d0.fr&&!_d0.ar){window.playFr=function(){parent.__speakWord(parent.SAMP_F,"fr")};window.playAr=function(){parent.__speakWord(parent.SAMP_A,"ar")};window.playBoth=function(){parent.__speakWord(parent.SAMP_F,"fr");setTimeout(function(){parent.__speakWord(parent.SAMP_A,"ar")},700)}}}catch(e){}<\/script>'
    +'</body></html>';
  return doc;
}
function renderCard(){
  var f=document.getElementById('cardFrame');
  window.SAMP_F=WORDS[cur][0]; window.SAMP_A=WORDS[cur][1];
  f.srcdoc=buildDoc();
  var fl=document.getElementById('flipBtn');
  fl.textContent=flipped?'🔄 ارجع للواجهة':'🔄 اقلب البطاقة';
  document.getElementById('wordIdx').textContent=(cur+1)+' / '+WORDS.length;
  markRow();
}
function nextWord(){cur=(cur+1)%WORDS.length;flipped=false;renderCard();}
function prevWord(){cur=(cur-1+WORDS.length)%WORDS.length;flipped=false;renderCard();}
document.getElementById('flipBtn').addEventListener('click',function(){flipped=!flipped;renderCard();});
document.getElementById('nextBtn').addEventListener('click',nextWord);
document.getElementById('prevBtn').addEventListener('click',prevWord);
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')nextWord();
  else if(e.key==='ArrowLeft')prevWord();
  else if(e.key==='f'||e.key==='F'){flipped=!flipped;renderCard();}
});

/* ---------- word list ---------- */
var listEl=document.getElementById('wordList');
var rows=[];
function renderList(filter){
  var q=(filter||'').trim().toLowerCase();
  var html=''; var n=0;
  WORDS.forEach(function(w,i){
    var ok=!q||w[0].toLowerCase().indexOf(q)>=0||w[1].toLowerCase().indexOf(q)>=0||w[2].toLowerCase().indexOf(q)>=0;
    if(!ok)return; n++;
    html+='<div class="wrow'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="fr">'+w[0]+'</span><span class="ar">'+w[1]+'</span><span class="do">'+w[2]+'</span></div>';
  });
  listEl.innerHTML=html||'<div class="empty">🔍 لا توجد نتائج مطابقة<br><br><button class="btn" onclick="clearSearch()">مسح البحث</button></div>';
  document.getElementById('wCount').textContent=n+' كلمة من '+WORDS.length;
  rows=Array.prototype.slice.call(listEl.querySelectorAll('.wrow'));
  rows.forEach(function(r){
    r.addEventListener('click',function(){
      cur=parseInt(r.getAttribute('data-i'),10); flipped=false;
      renderList(document.getElementById('searchInput').value); renderCard();
      r.scrollIntoView({block:'nearest'});
    });
  });
}
function markRow(){
  Array.prototype.forEach.call(listEl.querySelectorAll('.wrow'),function(r){
    r.classList.toggle('on',parseInt(r.getAttribute('data-i'),10)===cur);
  });
}
function clearSearch(){document.getElementById('searchInput').value='';renderList('');}
document.getElementById('searchInput').addEventListener('input',function(){renderList(this.value);});

/* ---------- init ---------- */
function dossiers(){var s={};WORDS.forEach(function(w){s[w[2]]=1;});return Object.keys(s).length;}
document.getElementById('stWords').textContent=WORDS.length;
document.getElementById('stDoss').textContent=dossiers();
renderList('');
renderCard();
toast('🎴 معرض رزمة فرنسي تاسع — كلمة المعاينة الحقيقية: La scène / مشهد');
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.classList.remove('show');},2600);}
</script>
