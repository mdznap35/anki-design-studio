<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anki Studio — Gallery V2</title>
<style>
/* ═══ RESET & TOKENS ═══ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#f5f5fa;
  --surface:#ffffff;
  --border:rgba(0,0,0,.07);
  --text:#1a1a2e;
  --text-2:#6b6b8d;
  --text-3:#a0a0b8;
  --accent:#5c5ce0;
  --accent-light:#8888f0;
  --accent-bg:rgba(92,92,224,.08);
  --green:#10b981;
  --red:#ef4444;
  --radius:14px;
  --radius-lg:20px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12);
  --font:system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;
  --header-h:56px;
  --bottom-h:72px;
}

html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-bg);color:var(--accent)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:99px}

/* ═══ HEADER ═══ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--header-h);
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 var(--radius);
  gap:var(--radius);
}
.hdr-brand{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.hdr-logo{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#5c5ce0,#8888f0,#c084fc);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:.75em;
  box-shadow:0 2px 8px rgba(92,92,224,.25);
}
.hdr-title{font-size:.82em;font-weight:700;letter-spacing:-.01em}
.hdr-sub{font-size:.55em;color:var(--text-3);font-weight:500;margin-top:-2px}
.hdr-count{
  margin-inline-start:auto;
  font-size:.68em;color:var(--text-2);font-weight:600;
  background:var(--accent-bg);color:var(--accent);
  padding:4px 12px;border-radius:99px;
}
.hdr-actions{display:flex;gap:6px}
.hdr-btn{
  width:34px;height:34px;border-radius:9px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-2);font-size:.78em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.hdr-btn:hover{background:var(--accent-bg);color:var(--accent);border-color:rgba(92,92,224,.15)}

/* ═══ MAIN STAGE — Full Screen Carousel ═══ */
.stage{
  position:fixed;top:var(--header-h);left:0;right:0;
  bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px));
  overflow:hidden;
  touch-action:pan-y;
}
.stage-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.card-frame{
  position:relative;
  width:min(420px,92vw);
  height:min(680px,88%);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s ease;
  will-change:transform;
}
.card-frame iframe{
  width:100%;height:100%;border:none;background:#fff;
}
.card-frame.enter-right{transform:translateX(60px) scale(.96);opacity:0}
.card-frame.enter-left{transform:translateX(-60px) scale(.96);opacity:0}
.card-frame.active{transform:none;opacity:1}

/* Swipe hint arrows */
.nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);
  z-index:50;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  box-shadow:var(--shadow-md);
  backdrop-filter:blur(8px);
  cursor:pointer;font-size:.9em;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;user-select:none;
}
.nav-arrow:hover{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(92,92,224,.3)}
.nav-arrow.prev{right:16px}
.nav-arrow.next{left:16px}
@media(max-width:600px){.nav-arrow{display:none}}

/* Template name overlay */
.tpl-name{
  position:absolute;top:12px;right:50%;transform:translateX(50%);
  z-index:10;
  font-size:.65em;font-weight:700;color:var(--text-2);
  background:rgba(255,255,255,.9);
  padding:4px 14px;border-radius:99px;
  border:1px solid var(--border);
  backdrop-filter:blur(8px);
  pointer-events:none;
  white-space:nowrap;
}

/* Flip indicator */
.flip-hint{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  font-size:.55em;color:var(--text-3);
  background:rgba(0,0,0,.04);
  padding:3px 10px;border-radius:99px;
  pointer-events:none;
  opacity:.7;transition:opacity .3s;
}
.flip-hint.hidden{opacity:0}

/* ═══ BOTTOM BAR — Audio + Navigation + Download ═══ */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px) saturate(160%);
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;
}
.bb-main{
  flex:1;display:flex;align-items:center;
  padding:0 16px;gap:12px;
}
/* Audio section */
.audio-section{display:flex;gap:6px;align-items:center}
.audio-btn{
  width:38px;height:38px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.85em;transition:all .2s ease;
}
.audio-play{
  background:var(--accent);color:#fff;
  box-shadow:0 2px 8px rgba(92,92,224,.3);
  width:42px;height:42px;font-size:1em;
}
.audio-play:hover{filter:brightness(1.1);box-shadow:0 4px 12px rgba(92,92,224,.35)}
.audio-play.playing{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.audio-fr,.audio-ar{
  background:var(--accent-bg);color:var(--accent);
  border:1px solid rgba(92,92,224,.1);
}
.audio-fr:hover,.audio-ar:hover{filter:brightness(.95)}

/* Dots navigation */
.dots-nav{
  flex:1;display:flex;justify-content:center;gap:5px;
  align-items:center;padding:0 8px;
  overflow-x:auto;scrollbar-width:none;
}
.dots-nav::-webkit-scrollbar{display:none}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,0,0,.12);cursor:pointer;
  transition:all .3s ease;flex-shrink:0;
}
.dot:hover{background:rgba(0,0,0,.25)}
.dot.on{width:20px;background:var(--accent)}

/* Download */
.download-btn{
  padding:9px 18px;border-radius:11px;
  border:none;background:var(--accent);color:#fff;
  font-weight:700;font-size:.7em;cursor:pointer;
  box-shadow:0 2px 8px rgba(92,92,224,.25);
  transition:all .25s ease;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.download-btn:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(92,92,224,.35);
}
.download-btn.all{
  background:transparent;color:var(--accent);
  border:1.5px solid var(--accent);
  box-shadow:none;
}
.download-btn.all:hover{background:var(--accent-bg)}

/* ═══ THUMBNAIL STRIP (optional toggle) ═══ */
.thumb-strip{
  position:fixed;bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0px));
  left:0;right:0;z-index:90;
  height:80px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:none;overflow-x:auto;
  padding:8px 12px;gap:8px;
  scrollbar-width:thin;
}
.thumb-strip.open{display:flex}
.thumb-item{
  width:52px;height:64px;border-radius:8px;
  border:2px solid transparent;cursor:pointer;
  overflow:hidden;flex-shrink:0;
  transition:all .2s ease;background:var(--surface);
}
.thumb-item:hover{border-color:rgba(92,92,224,.3)}
.thumb-item.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(92,92,224,.2)}
.thumb-item span{
  display:flex;align-items:center;justify-content:center;
  height:100%;font-size:.55em;font-weight:700;color:var(--text-3);
}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:calc(var(--bottom-h) + 16px);
  left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--text);color:#fff;
  padding:10px 22px;border-radius:12px;
  font-size:.72em;font-weight:600;
  opacity:0;pointer-events:none;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  z-index:9999;box-shadow:var(--shadow-lg);
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═══ LOADING ═══ */
.loader{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  transition:opacity .4s ease,visibility .4s;
}
.loader.hide{opacity:0;visibility:hidden}
.loader-ring{
  width:36px;height:36px;
  border:3px solid var(--accent-bg);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:.75em;color:var(--text-3);font-weight:500}

/* ═══ RESPONSIVE ═══ */
@media(max-width:600px){
  :root{--header-h:50px;--bottom-h:64px}
  .hdr-title{font-size:.75em}
  .hdr-count{display:none}
  .card-frame{height:calc(100% - 8px)}
  .audio-section{gap:4px}
  .audio-btn{width:34px;height:34px}
  .audio-play{width:38px;height:38px}
  .download-btn{padding:8px 14px;font-size:.65em}
  .dots-nav{gap:4px}
  .dot{width:5px;height:5px}
  .dot.on{width:16px}
}

/* Light mode accent for selected template colors */
.stage::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 30%,var(--stage-glow,rgba(92,92,224,.04)) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
</style>
</head>
<body>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <p>جاري تحميل القوالب…</p>
</div>

<!-- Header -->
<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">A</div>
    <div>
      <div class="hdr-title">Anki Studio V2</div>
      <div class="hdr-sub">معرض القوالب الاحترافي</div>
    </div>
  </div>
  <div class="hdr-count" id="tplCount">100 قالب</div>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="toggleThumbs()" title="عرض مصغرات">▦</button>
    <button class="hdr-btn" onclick="flipCard()" title="اقلب البطاقة">🔄</button>
    <button class="hdr-btn" onclick="goRandom()" title="قالب عشوائي">🎲</button>
  </div>
</div>

<!-- Stage -->
<div class="stage" id="stage">
  <div class="stage-inner" id="stageInner"></div>
</div>

<!-- Arrows -->
<button class="nav-arrow prev" onclick="prevTpl()" aria-label="السابق">→</button>
<button class="nav-arrow next" onclick="nextTpl()" aria-label="التالي">←</button>

<!-- Thumbnail strip -->
<div class="thumb-strip" id="thumbStrip"></div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="bb-main">
    <div class="audio-section">
      <button class="audio-btn audio-play" id="btnPlayBoth" onclick="playAudio('both')" title="تشغيل الكل">▶</button>
      <button class="audio-btn audio-fr" onclick="playAudio('fr')" title="فرنسي">🇫🇷</button>
      <button class="audio-btn audio-ar" onclick="playAudio('ar')" title="عربي">🇸🇦</button>
    </div>
    <div class="dots-nav" id="dotsNav"></div>
    <button class="download-btn all" onclick="downloadAll()">⬇ الكل</button>
    <button class="download-btn" onclick="downloadCurrent()">⬇ تنزيل</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/designs_100.js"></script>
<script src="/template_colors.js"></script>
<script>
'use strict';

// ═══ STATE ═══
let templates = [];
let currentIndex = 0;
let isFlipped = false;
let currentIframe = null;
let touchStartX = 0;
let isSwiping = false;

// ═══ INIT ═══
function init() {
  if (typeof EMBEDDED_DESIGNS_100 === 'undefined' || !EMBEDDED_DESIGNS_100 || !EMBEDDED_DESIGNS_100.length) {
    setTimeout(init, 500);
    return;
  }
  templates = EMBEDDED_DESIGNS_100;
  document.getElementById('tplCount').textContent = templates.length + ' قالب';
  buildDots();
  buildThumbs();
  renderCard();
  hideLoader();

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') nextTpl();
    if (e.key === 'ArrowRight') prevTpl();
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
  });

  // Touch swipe
  const stage = document.getElementById('stage');
  stage.addEventListener('touchstart', onTouchStart, {passive:true});
  stage.addEventListener('touchmove', onTouchMove, {passive:true});
  stage.addEventListener('touchend', onTouchEnd, {passive:true});

  // Mouse drag (desktop)
  stage.addEventListener('mousedown', onMouseDown);
  stage.addEventListener('mousemove', onMouseMove);
  stage.addEventListener('mouseup', onMouseUp);
}

function hideLoader() {
  document.getElementById('loader').classList.add('hide');
}

// ═══ CARD RENDERING ═══
function buildCardHTML(tpl, side) {
  const html = side === 'back' ? tpl.back : tpl.front;
  const css = tpl.css || '';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>*{margin:0;padding:0;box-sizing:border-box}' +
    'html,body{width:100%;height:100%;overflow:hidden}' +
    css.replace(/@import[^;]+;/g, '') +
    '</style></head><body>' + html + '</body></html>';
}

function renderCard(direction) {
  const inner = document.getElementById('stageInner');
  const tpl = templates[currentIndex];

  // Remove old card with animation
  const oldFrame = inner.querySelector('.card-frame');
  if (oldFrame) {
    oldFrame.classList.add(direction === 'next' ? 'enter-left' : 'enter-right');
    setTimeout(() => oldFrame.remove(), 350);
  }

  // Create new frame
  const frame = document.createElement('div');
  frame.className = 'card-frame ' + (direction === 'next' ? 'enter-right' : direction === 'prev' ? 'enter-left' : '');
  frame.innerHTML = `<span class="tpl-name">${tpl.name}</span><iframe sandbox="allow-scripts allow-same-origin" title="${tpl.name}"></iframe><span class="flip-hint" id="flipHint">اضغط مسافة أو 🔄 لقلب البطاقة</span>`;

  // Insert and animate in
  requestAnimationFrame(() => {
    inner.appendChild(frame);
    requestAnimationFrame(() => {
      frame.classList.add('active');
      frame.classList.remove('enter-right', 'enter-left');
    });
  });

  // Load content into iframe
  const iframe = frame.querySelector('iframe');
  currentIframe = iframe;
  loadTemplateContent(iframe, tpl);

  // Update UI
  updateDots();
  updateThumbs();
  updateStageGlow(tpl.name);
}

function loadTemplateContent(iframe, tpl) {
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  if (!doc) return;

  const html = buildCardHTML(tpl, isFlipped ? 'back' : 'front');
  doc.open();
  doc.write(html);
  doc.close();
}

// ═══ FLIP ═══
function flipCard() {
  isFlipped = !isFlipped;
  const tpl = templates[currentIndex];
  if (currentIframe) loadTemplateContent(currentIframe, tpl);
  showToast(isFlipped ? 'الخلف ←' : 'الأمام ←');
  const hint = document.getElementById('flipHint');
  if (hint) hint.classList.toggle('hidden', isFlipped);
}

// ═══ NAVIGATION ═══
function nextTpl() {
  currentIndex = (currentIndex + 1) % templates.length;
  renderCard('next');
}
function prevTpl() {
  currentIndex = (currentIndex - 1 + templates.length) % templates.length;
  renderCard('prev');
}
function goTo(index) {
  if (index === currentIndex) return;
  const dir = index > currentIndex ? 'next' : 'prev';
  currentIndex = index;
  renderCard(dir);
}
function goRandom() {
  let next;
  do { next = Math.floor(Math.random() * templates.length); } while (next === currentIndex && templates.length > 1);
  goTo(next);
  showToast('🎲 قالب عشوائي');
}

// ═══ TOUCH / MOUSE SWIPE ═══
function onTouchStart(e) { touchStartX = e.touches[0].clientX; isSwiping = true; }
function onTouchMove(e) {}
function onTouchEnd(e) {
  if (!isSwiping) return;
  isSwiping = false;
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    diff > 0 ? nextTpl() : prevTpl();
  }
}
function onMouseDown(e) { touchStartX = e.clientX; isSwiping = true; }
function onMouseMove(e) {}
function onMouseUp(e) {
  if (!isSwiping) return;
  isSwiping = false;
  const diff = touchStartX - e.clientX;
  if (Math.abs(diff) > 80) {
    diff > 0 ? nextTpl() : prevTpl();
  }
}

// ═══ AUDIO ═══
function playAudio(type) {
  const btn = document.getElementById('btnPlayBoth');
  btn.classList.add('playing');
  setTimeout(() => btn.classList.remove('playing'), 1500);

  try {
    currentIframe?.contentWindow?.playFr?.();
    if (type === 'ar') currentIframe?.contentWindow?.playAr?.();
    if (type === 'both') currentIframe?.contentWindow?.playBoth?.();
  } catch(e) {}

  const labels = {both:'🔊 تشغيل', fr:'🇫🇷 فرنسي', ar:'🇸🇦 عربي'};
  showToast(labels[type] || 'صوت');
}

// ═══ DOWNLOAD ═══
async function downloadCurrent() {
  const tpl = templates[currentIndex];
  showToast('⏳ جاري التحضير…');
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        designs: [tpl],
        deckName: `Anki V2 — ${tpl.name}`,
        includeAudio: true
      })
    });
    const data = await res.json();
    if (data.jobId) {
      pollDownload(data.jobId, tpl.name);
    } else {
      showToast('❌ فشل التحميل');
    }
  } catch(e) {
    showToast('❌ خطأ في الاتصال');
  }
}

async function downloadAll() {
  showToast(`⏳ تحضير ${templates.length} قالب…`);
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        designs: templates,
        deckName: 'Anki Studio V2 — Complete',
        includeAudio: true
      })
    });
    const data = await res.json();
    if (data.jobId) {
      pollDownload(data.jobId, 'Complete');
    } else {
      showToast('❌ فشل');
    }
  } catch(e) {
    showToast('❌ خطأ');
  }
}

function pollDownload(jobId, name) {
  const timer = setInterval(async () => {
    try {
      const res = await fetch(`/api/job/${jobId}`);
      const job = await res.json();
      if (job.status === 'done') {
        clearInterval(timer);
        window.location.href = `/api/download/${jobId}`;
        showToast(`✅ ${name}`);
      } else if (job.status === 'error') {
        clearInterval(timer);
        showToast('❌ فشل التحميل');
      }
    } catch(e) { clearInterval(timer); }
  }, 2000);
}

// ═══ DOTS NAVIGATION ═══
function buildDots() {
  const nav = document.getElementById('dotsNav');
  nav.innerHTML = '';
  for (let i = 0; i < templates.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.setAttribute('aria-label', `قالب ${i+1}`);
    dot.onclick = () => goTo(i);
    nav.appendChild(dot);
  }
}
function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('on', i === currentIndex));
  // Auto-scroll active dot into view
  if (dots[currentIndex]) {
    dots[currentIndex].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }
}

// ═══ THUMBNAIL STRIP ═══
function buildThumbs() {
  const strip = document.getElementById('thumbStrip');
  strip.innerHTML = '';
  for (let i = 0; i < templates.length; i++) {
    const item = document.createElement('div');
    item.className = 'thumb-item';
    item.innerHTML = `<span>${templates[i].name}</span>`;
    item.onclick = () => { goTo(i); toggleThumbs(); };
    strip.appendChild(item);
  }
}
function updateThumbs() {
  const items = document.querySelectorAll('.thumb-item');
  items.forEach((t, i) => t.classList.toggle('on', i === currentIndex));
}
function toggleThumbs() {
  document.getElementById('thumbStrip').classList.toggle('open');
}

// ═══ STAGE GLOW (matches template accent) ═══
function updateStageGlow(name) {
  const stage = document.getElementById('stage');
  if (typeof TEMPLATE_COLORS !== 'undefined' && TEMPLATE_COLORS[name]) {
    const c = TEMPLATE_COLORS[name].accent;
    stage.style.setProperty('--stage-glow', hexToRgba(c, .06));
  }
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ═══ TOAST ═══
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// Start when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
