<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anki Studio — Gallery V2</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5fa;--surface:#fff;--border:rgba(0,0,0,.07);
  --text:#1a1a2e;--text-2:#6b6b8d;--text-3:#a0a0b8;
  --accent:#5c5ce0;--accent-bg:rgba(92,92,224,.08);
  --radius:14px;--radius-lg:20px;
  --shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.12);
  --header-h:56px;--bottom-h:72px;
}
body{font-family:system-ui,-apple-system,'Segoe UI','Noto Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-bg);color:var(--accent)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:99px}

/* Loader */
.loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-ring{width:36px;height:36px;border:3px solid var(--accent-bg);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:.75em;color:var(--text-3)}
.loader .err{color:#ef4444;font-size:.7em;margin-top:8px;display:none}

/* Header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--header-h);background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px}
.hdr-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5c5ce0,#8888f0,#c084fc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.75rem;box-shadow:0 2px 8px rgba(92,92,224,.25)}
.hdr-title{font-size:.82em;font-weight:700}
.hdr-sub{font-size:.55em;color:var(--text-3);margin-top:-2px}
.hdr-count{margin-inline-start:auto;font-size:.68em;color:var(--accent);background:var(--accent-bg);padding:4px 12px;border-radius:99px;font-weight:600}
.hdr-actions{display:flex;gap:6px}
.hdr-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:.78em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.hdr-btn:hover{background:var(--accent-bg);color:var(--accent)}

/* Stage */
.stage{position:fixed;top:var(--header-h);left:0;right:0;bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0));overflow:hidden;touch-action:pan-y}
.stage-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.card-frame{position:relative;width:min(420px,92vw);height:min(680px,88%);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s}
.card-frame iframe{width:100%;height:100%;border:none;background:#fff}
.card-frame.slide-out-left{transform:translateX(-60px) scale(.96);opacity:0}
.card-frame.slide-out-right{transform:translateX(60px) scale(.96);opacity:0}
.tpl-name{position:absolute;top:12px;right:50%;transform:translateX(50%);z-index:10;font-size:.65em;font-weight:700;color:var(--text-2);background:rgba(255,255,255,.9);padding:4px 14px;border-radius:99px;border:1px solid var(--border);backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
.flip-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:.55em;color:var(--text-3);background:rgba(0,0,0,.04);padding:3px 10px;border-radius:99px;pointer-events:none;opacity:.7}

/* Arrows */
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--border);box-shadow:var(--shadow-md);cursor:pointer;font-size:.9em;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:all .25s;user-select:none}
.nav-arrow:hover{background:var(--accent);color:#fff;border-color:transparent}
.nav-arrow.prev{right:16px}.nav-arrow.next{left:16px}
@media(max-width:600px){.nav-arrow{display:none}}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;height:calc(var(--bottom-h) + env(safe-area-inset-bottom,0));padding-bottom:env(safe-area-inset-bottom,0);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;flex-direction:column}
.bb-main{flex:1;display:flex;align-items:center;padding:0 16px;gap:12px}
.audio-section{display:flex;gap:6px;align-items:center}
.audio-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85em;transition:all .2s}
.audio-play{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(92,92,224,.3);width:42px;height:42px;font-size:1rem}
.audio-play:hover{filter:brightness(1.1)}
.audio-fr,.audio-ar{background:var(--accent-bg);color:var(--accent);border:1px solid rgba(92,92,224,.1)}
.dots-nav{flex:1;display:flex;justify-content:center;gap:5px;align-items:center;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.dots-nav::-webkit-scrollbar{display:none}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.12);cursor:pointer;transition:all .3s;flex-shrink:0}
.dot.on{width:20px;background:var(--accent)}
.download-btn{padding:9px 18px;border-radius:11px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.7rem;cursor:pointer;box-shadow:0 2px 8px rgba(92,92,224,.25);transition:all .25s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.download-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.download-btn.all{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}

/* Toast */
.toast{position:fixed;bottom:calc(var(--bottom-h) + 16px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:#fff;padding:10px 22px;border-radius:12px;font-size:.72em;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Thumbs */
.thumb-strip{position:fixed;bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom,0));left:0;right:0;z-index:90;height:80px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:none;overflow-x:auto;padding:8px 12px;gap:8px}
.thumb-strip.open{display:flex}
.thumb-item{width:52px;height:64px;border-radius:8px;border:2px solid transparent;cursor:pointer;overflow:hidden;flex-shrink:0;transition:all .2s;background:var(--surface)}
.thumb-item.on{border-color:var(--accent)}
.thumb-item span{display:flex;align-items:center;justify-content:center;height:100%;font-size:.55rem;font-weight:700;color:var(--text-3)}

@media(max-width:600px){
  :root{--header-h:50px;--bottom-h:64px}
  .hdr-count{display:none}
  .card-frame{height:calc(100% - 8px)}
  .audio-btn{width:34px;height:34px}.audio-play{width:38px;height:38px}
  .download-btn{padding:8px 14px;font-size:.65rem}
  .dot{width:5px;height:5px}.dot.on{width:16px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <p>جاري تحميل القوالب…</p>
  <p class="err" id="loadErr"></p>
</div>

<div class="hdr">
  <div class="hdr-logo">A</div>
  <div><div class="hdr-title">Anki Studio V2</div><div class="hdr-sub">معرض القوالب</div></div>
  <div class="hdr-count" id="tplCount"></div>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="toggleThumbs()" title="مصغرات">▦</button>
    <button class="hdr-btn" onclick="flipCard()" title="اقلب">🔄</button>
    <button class="hdr-btn" onclick="goRandom()" title="عشوائي">🎲</button>
  </div>
</div>

<div class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></div>

<button class="nav-arrow prev" onclick="prevTpl()">→</button>
<button class="nav-arrow next" onclick="nextTpl()">←</button>

<div class="thumb-strip" id="thumbStrip"></div>

<div class="bottom-bar">
  <div class="bb-main">
    <div class="audio-section">
      <button class="audio-btn audio-play" id="btnPlay" onclick="playAudio('both')">▶</button>
      <button class="audio-btn audio-fr" onclick="playAudio('fr')">🇫🇷</button>
      <button class="audio-btn audio-ar" onclick="playAudio('ar')">🇸🇦</button>
    </div>
    <div class="dots-nav" id="dotsNav"></div>
    <button class="download-btn all" onclick="downloadAll()">⬇ الكل</button>
    <button class="download-btn" onclick="downloadCurrent()">⬇ تنزيل</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Wait for designs to load with retry
var _tplData = null;
var _retryCount = 0;
var MAX_RETRIES = 30;

function waitForDesigns() {
  _retryCount++;
  try {
    if (typeof EMBEDDED_DESIGNS_100 !== 'undefined' && EMBEDDED_DESIGNS_100 && EMBEDDED_DESIGNS_100.length > 0) {
      _tplData = EMBEDDED_DESIGNS_100;
      startGallery();
      return;
    }
  } catch(e) {
    // Variable not ready yet
  }

  if (_retryCount >= MAX_RETRIES) {
    var err = document.getElementById('loadErr');
    err.textContent = 'فشل تحميل القوالب — حدّث الصفحة';
    err.style.display = 'block';
    document.querySelector('.loader-ring').style.display = 'none';
    return;
  }
  setTimeout(waitForDesigns, 300);
}

function startGallery() {
  window._templates = _tplData;
  window._currentIndex = 0;
  window._isFlipped = false;
  window._currentIframe = null;

  document.getElementById('tplCount').textContent = _tplData.length + ' قالب';
  buildDots();
  buildThumbs();
  renderCard();
  hideLoader();

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') nextTpl();
    if (e.key === 'ArrowRight') prevTpl();
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
  });

  // Touch swipe
  var stage = document.getElementById('stage');
  var startX = 0;
  var swiping = false;

  stage.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; swiping = true; }, {passive:true});
  stage.addEventListener('touchend', function(e) {
    if (!swiping) return;
    swiping = false;
    var diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) { diff > 0 ? nextTpl() : prevTpl(); }
  }, {passive:true});

  // Mouse drag
  stage.addEventListener('mousedown', function(e) { startX = e.clientX; swiping = true; });
  stage.addEventListener('mouseup', function(e) {
    if (!swiping) return;
    swiping = false;
    var diff = startX - e.clientX;
    if (Math.abs(diff) > 80) { diff > 0 ? nextTpl() : prevTpl(); }
  });
}

function hideLoader() {
  document.getElementById('loader').classList.add('hide');
}

function buildCardHTML(tpl, side) {
  var html = side === 'back' ? tpl.back : tpl.front;
  var css = tpl.css || '';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}' +
    css.replace(/@import[^;]+;/g, '') +
    '</style></head><body>' + html + '</body></html>';
}

function renderCard(direction) {
  var inner = document.getElementById('stageInner');
  var tpl = window._templates[window._currentIndex];

  // Remove old
  var old = inner.querySelector('.card-frame');
  if (old) old.remove();

  // Create new
  var frame = document.createElement('div');
  frame.className = 'card-frame';
  frame.innerHTML = '<span class="tpl-name">' + tpl.name + '</span>' +
    '<iframe sandbox="allow-scripts allow-same-origin" title="' + tpl.name + '"></iframe>' +
    '<span class="flip-hint">اضغط مسافة لقلب البطاقة</span>';
  inner.appendChild(frame);

  var iframe = frame.querySelector('iframe');
  window._currentIframe = iframe;

  // Load content
  setTimeout(function() {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (doc) {
        doc.open();
        doc.write(buildCardHTML(tpl, window._isFlipped ? 'back' : 'front'));
        doc.close();
      }
    } catch(e) {
      // Fallback: use srcdoc
      iframe.srcdoc = buildCardHTML(tpl, window._isFlipped ? 'back' : 'front');
    }
  }, 50);

  updateDots();
}

function flipCard() {
  window._isFlipped = !window._isFlipped;
  var tpl = window._templates[window._currentIndex];
  var iframe = window._currentIframe;
  if (iframe) {
    try {
      var doc = iframe.contentDocument || iframe.contentWindow.document;
      if (doc) {
        doc.open();
        doc.write(buildCardHTML(tpl, window._isFlipped ? 'back' : 'front'));
        doc.close();
      }
    } catch(e) {
      iframe.srcdoc = buildCardHTML(tpl, window._isFlipped ? 'back' : 'front');
    }
  }
  showToast(window._isFlipped ? 'الخلف' : 'الأمام');
}

function nextTpl() {
  window._currentIndex = (window._currentIndex + 1) % window._templates.length;
  renderCard();
}
function prevTpl() {
  window._currentIndex = (window._currentIndex - 1 + window._templates.length) % window._templates.length;
  renderCard();
}
function goTo(i) {
  if (i === window._currentIndex) return;
  window._currentIndex = i;
  renderCard();
}
function goRandom() {
  var n;
  do { n = Math.floor(Math.random() * window._templates.length); } while (n === window._currentIndex && window._templates.length > 1);
  goTo(n);
  showToast('قالب عشوائي');
}

function playAudio(type) {
  var btn = document.getElementById('btnPlay');
  btn.textContent = '♪';
  setTimeout(function() { btn.textContent = '▶'; }, 1200);

  try {
    var win = window._currentIframe && window._currentIframe.contentWindow;
    if (win) {
      if (type === 'fr' && win.playFr) win.playFr();
      else if (type === 'ar' && win.playAr) win.playAr();
      else if (win.playBoth) win.playBoth();
      else if (win.playFr) win.playFr();
    }
  } catch(e) {}
  showToast('🔊 صوت');
}

async function downloadCurrent() {
  showToast('⏳ جاري التحضير…');
  var tpl = window._templates[window._currentIndex];
  try {
    var res = await fetch('/api/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({designs:[tpl], deckName:'Anki V2 — '+tpl.name, includeAudio:true})
    });
    var data = await res.json();
    if (data.jobId) pollDownload(data.jobId);
    else showToast('❌ فشل');
  } catch(e) { showToast('❌ خطأ'); }
}

async function downloadAll() {
  showToast('⏳ تحضير الكل…');
  try {
    var res = await fetch('/api/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({designs:window._templates, deckName:'Anki V2 Complete', includeAudio:true})
    });
    var data = await res.json();
    if (data.jobId) pollDownload(data.jobId);
    else showToast('❌ فشل');
  } catch(e) { showToast('❌ خطأ'); }
}

function pollDownload(jobId) {
  var timer = setInterval(async function() {
    try {
      var res = await fetch('/api/job/'+jobId);
      var job = await res.json();
      if (job.status === 'done') {
        clearInterval(timer);
        window.location.href = '/api/download/'+jobId;
        showToast('✅ تم');
      } else if (job.status === 'error') {
        clearInterval(timer);
        showToast('❌ فشل');
      }
    } catch(e) { clearInterval(timer); }
  }, 2000);
}

function buildDots() {
  var nav = document.getElementById('dotsNav');
  nav.innerHTML = '';
  for (var i = 0; i < window._templates.length; i++) {
    (function(idx) {
      var d = document.createElement('div');
      d.className = 'dot';
      d.onclick = function() { goTo(idx); };
      nav.appendChild(d);
    })(i);
  }
  updateDots();
}

function updateDots() {
  var dots = document.querySelectorAll('.dot');
  for (var i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('on', i === window._currentIndex);
  }
  if (dots[window._currentIndex]) {
    dots[window._currentIndex].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }
}

function buildThumbs() {
  var strip = document.getElementById('thumbStrip');
  strip.innerHTML = '';
  for (var i = 0; i < window._templates.length; i++) {
    (function(idx) {
      var t = document.createElement('div');
      t.className = 'thumb-item';
      t.innerHTML = '<span>'+window._templates[idx].name+'</span>';
      t.onclick = function() { goTo(idx); toggleThumbs(); };
      strip.appendChild(t);
    })(i);
  }
}

function toggleThumbs() {
  document.getElementById('thumbStrip').classList.toggle('open');
}

var toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1800);
}

// Start waiting for templates
waitForDesigns();
</script>
</body>
</html>
